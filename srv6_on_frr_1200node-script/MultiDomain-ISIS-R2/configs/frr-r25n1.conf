!
! FRR configuration for r25n1
! IS-IS area: 2  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r25n1
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0019:0001::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r25n1-r25n0
 ipv6 address fc00:0019:0000:0001::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r25n1-r25n2
 ipv6 address fc00:0019:0001:0002::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r25n1-r24n1
 ipv6 address fc00:9000:0018:0001::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r25n1-r26n1
 ipv6 address fc00:9000:0019:0001::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0002.0000.0019.0001.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
