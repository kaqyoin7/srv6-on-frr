!
! FRR configuration for r35n17
! IS-IS area: 3  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r35n17
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0023:0011::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r35n17-r35n16
 ipv6 address fc00:0023:0010:0011::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r35n17-r35n18
 ipv6 address fc00:0023:0011:0012::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r35n17-r34n17
 ipv6 address fc00:9000:0022:0011::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r35n17-r36n17
 ipv6 address fc00:9000:0023:0011::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0003.0000.0023.0011.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
