!
! FRR configuration for r19n0
! IS-IS area: 2  is-type: level-2-only  role: transit-backbone
!
frr version 10.5.1
frr defaults traditional
hostname r19n0
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0013:0000::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-2-only
!
interface r19n0-r19n1
 ipv6 address fc00:0013:0000:0001::1/64
!
interface r19n0-r19n19
 ipv6 address fc00:0013:0013:0000::2/64
!
interface r19n0-r18n0
 ipv6 address fc00:9000:0012:0000::2/64
 ipv6 router isis SRv6
 isis circuit-type level-2-only
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r19n0-r20n0
 ipv6 address fc00:9000:0013:0000::1/64
 ipv6 router isis SRv6
 isis circuit-type level-2-only
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0002.0000.0013.0000.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
 log-adjacency-changes
!
line vty
!
end
