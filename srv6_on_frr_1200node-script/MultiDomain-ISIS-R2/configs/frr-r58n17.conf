!
! FRR configuration for r58n17
! IS-IS area: 4  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r58n17
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:003a:0011::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r58n17-r58n16
 ipv6 address fc00:003a:0010:0011::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r58n17-r58n18
 ipv6 address fc00:003a:0011:0012::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r58n17-r57n17
 ipv6 address fc00:9000:0039:0011::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r58n17-r59n17
 ipv6 address fc00:9000:003a:0011::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.003a.0011.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
