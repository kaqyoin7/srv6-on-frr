!
! FRR configuration for r54n15
! IS-IS area: 4  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r54n15
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0036:000f::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r54n15-r54n14
 ipv6 address fc00:0036:000e:000f::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r54n15-r54n16
 ipv6 address fc00:0036:000f:0010::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r54n15-r53n15
 ipv6 address fc00:9000:0035:000f::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r54n15-r55n15
 ipv6 address fc00:9000:0036:000f::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.0036.000f.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
