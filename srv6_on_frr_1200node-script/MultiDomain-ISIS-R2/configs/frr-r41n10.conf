!
! FRR configuration for r41n10
! IS-IS area: 3  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r41n10
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0029:000a::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r41n10-r41n9
 ipv6 address fc00:0029:0009:000a::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r41n10-r41n11
 ipv6 address fc00:0029:000a:000b::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r41n10-r40n10
 ipv6 address fc00:9000:0028:000a::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r41n10-r42n10
 ipv6 address fc00:9000:0029:000a::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0003.0000.0029.000a.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
