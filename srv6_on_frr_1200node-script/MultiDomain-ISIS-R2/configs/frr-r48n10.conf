!
! FRR configuration for r48n10
! IS-IS area: 4  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r48n10
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0030:000a::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r48n10-r48n9
 ipv6 address fc00:0030:0009:000a::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r48n10-r48n11
 ipv6 address fc00:0030:000a:000b::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r48n10-r47n10
 ipv6 address fc00:9000:002f:000a::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r48n10-r49n10
 ipv6 address fc00:9000:0030:000a::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.0030.000a.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
