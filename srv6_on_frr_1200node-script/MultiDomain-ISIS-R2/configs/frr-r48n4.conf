!
! FRR configuration for r48n4
! IS-IS area: 4  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r48n4
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0030:0004::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r48n4-r48n3
 ipv6 address fc00:0030:0003:0004::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r48n4-r48n5
 ipv6 address fc00:0030:0004:0005::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r48n4-r47n4
 ipv6 address fc00:9000:002f:0004::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r48n4-r49n4
 ipv6 address fc00:9000:0030:0004::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.0030.0004.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
