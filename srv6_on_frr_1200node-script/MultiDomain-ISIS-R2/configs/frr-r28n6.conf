!
! FRR configuration for r28n6
! IS-IS area: 2  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r28n6
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:001c:0006::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r28n6-r28n5
 ipv6 address fc00:001c:0005:0006::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r28n6-r28n7
 ipv6 address fc00:001c:0006:0007::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r28n6-r27n6
 ipv6 address fc00:9000:001b:0006::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r28n6-r29n6
 ipv6 address fc00:9000:001c:0006::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0002.0000.001c.0006.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
