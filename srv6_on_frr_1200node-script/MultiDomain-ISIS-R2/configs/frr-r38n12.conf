!
! FRR configuration for r38n12
! IS-IS area: 3  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r38n12
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0026:000c::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r38n12-r38n11
 ipv6 address fc00:0026:000b:000c::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r38n12-r38n13
 ipv6 address fc00:0026:000c:000d::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r38n12-r37n12
 ipv6 address fc00:9000:0025:000c::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r38n12-r39n12
 ipv6 address fc00:9000:0026:000c::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0003.0000.0026.000c.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
