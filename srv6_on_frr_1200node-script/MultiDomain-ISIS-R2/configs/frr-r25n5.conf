!
! FRR configuration for r25n5
! IS-IS area: 2  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r25n5
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0019:0005::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r25n5-r25n4
 ipv6 address fc00:0019:0004:0005::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r25n5-r25n6
 ipv6 address fc00:0019:0005:0006::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r25n5-r24n5
 ipv6 address fc00:9000:0018:0005::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r25n5-r26n5
 ipv6 address fc00:9000:0019:0005::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0002.0000.0019.0005.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
