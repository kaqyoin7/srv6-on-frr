!
! FRR configuration for r41n0
! IS-IS area: 3  is-type: level-2-only  role: transit-backbone
!
frr version 10.5.1
frr defaults traditional
hostname r41n0
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0029:0000::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-2-only
!
interface r41n0-r41n1
 ipv6 address fc00:0029:0000:0001::1/64
!
interface r41n0-r41n19
 ipv6 address fc00:0029:0013:0000::2/64
!
interface r41n0-r40n0
 ipv6 address fc00:9000:0028:0000::2/64
 ipv6 router isis SRv6
 isis circuit-type level-2-only
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r41n0-r42n0
 ipv6 address fc00:9000:0029:0000::1/64
 ipv6 router isis SRv6
 isis circuit-type level-2-only
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0003.0000.0029.0000.00
 is-type level-2-only
 metric-style wide
 topology ipv6-unicast
 log-adjacency-changes
!
line vty
!
end
