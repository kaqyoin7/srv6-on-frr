!
! FRR configuration for r44n13
! IS-IS area: 3  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r44n13
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:002c:000d::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r44n13-r44n12
 ipv6 address fc00:002c:000c:000d::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r44n13-r44n14
 ipv6 address fc00:002c:000d:000e::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r44n13-r43n13
 ipv6 address fc00:9000:002b:000d::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r44n13-r45n13
 ipv6 address fc00:9000:002c:000d::1/64
!
router isis SRv6
 net 49.0003.0000.002c.000d.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
