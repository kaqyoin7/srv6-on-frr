!
! FRR configuration for r15n0
! IS-IS area: 2  is-type: level-1-2  role: boundary-backbone
!
frr version 10.5.1
frr defaults traditional
hostname r15n0
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:000f:0000::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r15n0-r15n1
 ipv6 address fc00:000f:0000:0001::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r15n0-r15n19
