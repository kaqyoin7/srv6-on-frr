!
! FRR configuration for r28n17
! IS-IS area: 2  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r28n17
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:001c:0011::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r28n17-r28n16
 ipv6 address fc00:001c:0010:0011::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r28n17-r28n18
 ipv6 address fc00:001c:0011:0012::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r28n17-r27n17
 ipv6 address fc00:9000:001b:0011::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r28n17-r29n17
 ipv6 address fc00:9000:001c:0011::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0002.0000.001c.0011.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
