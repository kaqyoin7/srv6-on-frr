!
! FRR configuration for r26n12
! IS-IS area: 2  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r26n12
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:001a:000c::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r26n12-r26n11
 ipv6 address fc00:001a:000b:000c::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r26n12-r26n13
 ipv6 address fc00:001a:000c:000d::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r26n12-r25n12
 ipv6 address fc00:9000:0019:000c::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r26n12-r27n12
 ipv6 address fc00:9000:001a:000c::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0002.0000.001a.000c.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
