!
! FRR configuration for r50n6
! IS-IS area: 4  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r50n6
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0032:0006::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r50n6-r50n5
 ipv6 address fc00:0032:0005:0006::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r50n6-r50n7
 ipv6 address fc00:0032:0006:0007::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r50n6-r49n6
 ipv6 address fc00:9000:0031:0006::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r50n6-r51n6
 ipv6 address fc00:9000:0032:0006::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.0032.0006.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
