!
! FRR configuration for r51n17
! IS-IS area: 4  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r51n17
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0033:0011::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r51n17-r51n16
 ipv6 address fc00:0033:0010:0011::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r51n17-r51n18
 ipv6 address fc00:0033:0011:0012::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r51n17-r50n17
 ipv6 address fc00:9000:0032:0011::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r51n17-r52n17
 ipv6 address fc00:9000:0033:0011::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.0033.0011.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
