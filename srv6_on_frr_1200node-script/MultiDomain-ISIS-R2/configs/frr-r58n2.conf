!
! FRR configuration for r58n2
! IS-IS area: 4  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r58n2
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:003a:0002::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r58n2-r58n1
 ipv6 address fc00:003a:0001:0002::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r58n2-r58n3
 ipv6 address fc00:003a:0002:0003::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r58n2-r57n2
 ipv6 address fc00:9000:0039:0002::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r58n2-r59n2
 ipv6 address fc00:9000:003a:0002::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.003a.0002.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
