!
! FRR configuration for r51n11
! IS-IS area: 4  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r51n11
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0033:000b::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r51n11-r51n10
 ipv6 address fc00:0033:000a:000b::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r51n11-r51n12
 ipv6 address fc00:0033:000b:000c::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r51n11-r50n11
 ipv6 address fc00:9000:0032:000b::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r51n11-r52n11
 ipv6 address fc00:9000:0033:000b::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.0033.000b.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
