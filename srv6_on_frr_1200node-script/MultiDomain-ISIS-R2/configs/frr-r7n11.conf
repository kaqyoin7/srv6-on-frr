!
! FRR configuration for r7n11
! IS-IS area: 1  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r7n11
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0007:000b::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r7n11-r7n10
 ipv6 address fc00:0007:000a:000b::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r7n11-r7n12
 ipv6 address fc00:0007:000b:000c::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r7n11-r6n11
 ipv6 address fc00:9000:0006:000b::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r7n11-r8n11
 ipv6 address fc00:9000:0007:000b::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0001.0000.0007.000b.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
