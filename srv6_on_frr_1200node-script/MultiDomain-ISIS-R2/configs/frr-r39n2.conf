!
! FRR configuration for r39n2
! IS-IS area: 3  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r39n2
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0027:0002::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r39n2-r39n1
 ipv6 address fc00:0027:0001:0002::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r39n2-r39n3
 ipv6 address fc00:0027:0002:0003::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r39n2-r38n2
 ipv6 address fc00:9000:0026:0002::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r39n2-r40n2
 ipv6 address fc00:9000:0027:0002::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0003.0000.0027.0002.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
