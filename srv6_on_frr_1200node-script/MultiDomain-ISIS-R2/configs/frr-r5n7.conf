!
! FRR configuration for r5n7
! IS-IS area: 1  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r5n7
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0005:0007::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r5n7-r5n6
 ipv6 address fc00:0005:0006:0007::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r5n7-r5n8
 ipv6 address fc00:0005:0007:0008::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r5n7-r4n7
 ipv6 address fc00:9000:0004:0007::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r5n7-r6n7
 ipv6 address fc00:9000:0005:0007::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0001.0000.0005.0007.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
