!
! FRR configuration for r10n16
! IS-IS area: 1  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r10n16
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:000a:0010::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r10n16-r10n15
 ipv6 address fc00:000a:000f:0010::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r10n16-r10n17
 ipv6 address fc00:000a:0010:0011::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r10n16-r9n16
 ipv6 address fc00:9000:0009:0010::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r10n16-r11n16
 ipv6 address fc00:9000:000a:0010::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0001.0000.000a.0010.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
