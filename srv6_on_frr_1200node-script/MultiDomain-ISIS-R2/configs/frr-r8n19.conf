!
! FRR configuration for r8n19
! IS-IS area: 1  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r8n19
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0008:0013::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r8n19-r8n18
 ipv6 address fc00:0008:0012:0013::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r8n19-r8n0
 ipv6 address fc00:0008:0013:0000::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r8n19-r7n19
 ipv6 address fc00:9000:0007:0013::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r8n19-r9n19
 ipv6 address fc00:9000:0008:0013::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0001.0000.0008.0013.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
