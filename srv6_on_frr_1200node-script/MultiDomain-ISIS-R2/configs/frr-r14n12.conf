!
! FRR configuration for r14n12
! IS-IS area: 1  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r14n12
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:000e:000c::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r14n12-r14n11
 ipv6 address fc00:000e:000b:000c::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r14n12-r14n13
 ipv6 address fc00:000e:000c:000d::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r14n12-r13n12
 ipv6 address fc00:9000:000d:000c::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r14n12-r15n12
 ipv6 address fc00:9000:000e:000c::1/64
!
router isis SRv6
 net 49.0001.0000.000e.000c.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
