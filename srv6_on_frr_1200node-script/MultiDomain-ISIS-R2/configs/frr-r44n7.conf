!
! FRR configuration for r44n7
! IS-IS area: 3  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r44n7
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:002c:0007::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r44n7-r44n6
 ipv6 address fc00:002c:0006:0007::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r44n7-r44n8
 ipv6 address fc00:002c:0007:0008::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r44n7-r43n7
 ipv6 address fc00:9000:002b:0007::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r44n7-r45n7
 ipv6 address fc00:9000:002c:0007::1/64
!
router isis SRv6
 net 49.0003.0000.002c.0007.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
