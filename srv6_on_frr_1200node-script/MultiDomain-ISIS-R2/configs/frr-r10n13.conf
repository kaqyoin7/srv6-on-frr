!
! FRR configuration for r10n13
! IS-IS area: 1  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r10n13
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:000a:000d::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r10n13-r10n12
 ipv6 address fc00:000a:000c:000d::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r10n13-r10n14
 ipv6 address fc00:000a:000d:000e::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r10n13-r9n13
 ipv6 address fc00:9000:0009:000d::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r10n13-r11n13
 ipv6 address fc00:9000:000a:000d::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0001.0000.000a.000d.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
