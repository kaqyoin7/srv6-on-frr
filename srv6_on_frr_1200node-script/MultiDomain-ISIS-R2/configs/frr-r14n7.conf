!
! FRR configuration for r14n7
! IS-IS area: 1  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r14n7
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:000e:0007::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r14n7-r14n6
 ipv6 address fc00:000e:0006:0007::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r14n7-r14n8
 ipv6 address fc00:000e:0007:0008::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r14n7-r13n7
 ipv6 address fc00:9000:000d:0007::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r14n7-r15n7
 ipv6 address fc00:9000:000e:0007::1/64
!
router isis SRv6
 net 49.0001.0000.000e.0007.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
