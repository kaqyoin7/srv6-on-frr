!
! FRR configuration for r56n2
! IS-IS area: 4  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r56n2
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0038:0002::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r56n2-r56n1
 ipv6 address fc00:0038:0001:0002::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r56n2-r56n3
 ipv6 address fc00:0038:0002:0003::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r56n2-r55n2
 ipv6 address fc00:9000:0037:0002::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r56n2-r57n2
 ipv6 address fc00:9000:0038:0002::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.0038.0002.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
