!
! FRR configuration for r30n9
! IS-IS area: 3  is-type: level-1-2
!
frr version 9.1
frr defaults traditional
hostname r30n9
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:001e:0009::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r30n9-r30n8
 ipv6 address fc00:001e:0008:0009::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r30n9-r30n10
 ipv6 address fc00:001e:0009:000a::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r30n9-r29n9
 ipv6 address fc00:9000:001d:0009::2/64
 ipv6 router isis SRv6
 isis circuit-type level-2-only
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r30n9-r31n9
 ipv6 address fc00:9000:001e:0009::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
