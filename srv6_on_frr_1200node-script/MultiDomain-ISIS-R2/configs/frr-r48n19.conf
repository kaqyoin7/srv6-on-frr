!
! FRR configuration for r48n19
! IS-IS area: 4  is-type: level-1
!
frr version 9.1
frr defaults traditional
hostname r48n19
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0030:0013::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r48n19-r48n18
 ipv6 address fc00:0030:0012:0013::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r48n19-r48n0
 ipv6 address fc00:0030:0013:0000::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r48n19-r47n19
 ipv6 address fc00:9000:002f:0013::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r48n19-r49n19
 ipv6 address fc00:9000:0030:0013::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.0030.0013.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
