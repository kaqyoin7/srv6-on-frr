!
! FRR configuration for r55n10
! IS-IS area: 4  is-type: level-1  role: area
!
frr version 10.5.1
frr defaults traditional
hostname r55n10
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo
 description SRv6 Locator Interface
 ipv6 address fc00:0037:000a::1/128
 ipv6 router isis SRv6
 isis passive
 isis circuit-type level-1
!
interface r55n10-r55n9
 ipv6 address fc00:0037:0009:000a::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r55n10-r55n11
 ipv6 address fc00:0037:000a:000b::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r55n10-r54n10
 ipv6 address fc00:9000:0036:000a::2/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
interface r55n10-r56n10
 ipv6 address fc00:9000:0037:000a::1/64
 ipv6 router isis SRv6
 isis circuit-type level-1
 isis network point-to-point
 isis hello-interval 3
 isis hello-multiplier 3
!
router isis SRv6
 net 49.0004.0000.0037.000a.00
 is-type level-1
 metric-style wide
 topology ipv6-unicast
 attached-bit receive
 log-adjacency-changes
!
line vty
!
end
